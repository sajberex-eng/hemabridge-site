<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Ysabeau:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;display:grid;grid-template-columns:560px 1fr;background:#FBF7F0;color:#22302A;font-family:"Golos Text",Arial,sans-serif;overflow:hidden}
.text{padding:64px 0 60px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px;font:700 40px/1 "Ysabeau",Georgia,serif;color:#24392F}
.brand img{width:72px;height:72px;border-radius:20px}
h1{font:700 54px/1.1 "Ysabeau",Georgia,serif;margin-top:auto;color:#24392F;}
p{font-size:25px;line-height:1.4;color:#58635C;margin-top:22px}
.who{font-size:21px;font-weight:500;color:#3D6150;margin-top:36px}
.art{background:url(../img/hero-bridge.webp) 42% 50%/cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%);mask-image:linear-gradient(90deg,transparent 0,#000 16%)}
</style></head>
<body>
<div class="text">
  <div class="brand"><img src="../img/logo.png" alt="">HemaBridge</div>
  <h1>Лечение за рубежом&nbsp;—<br>с&nbsp;врачом дома</h1>
  <p>Трансплантация костного мозга и&nbsp;CAR&#8209;T для пациентов из Казахстана</p>
  <div class="who">Программа Центра гематологии · Астана</div>
</div>
<div class="art"></div>
</body></html>
